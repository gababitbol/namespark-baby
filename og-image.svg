<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="85%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#f3e9dd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fbf9f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a27a"/>
      <stop offset="100%" stop-color="#a9805a"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a27a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c9a27a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#fbf9f6"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="url(#spark)"/>

  <!-- Top accent line -->
  <rect x="80" y="72" width="320" height="2" fill="url(#accentLine)" opacity="0.5"/>

  <!-- Logo circle -->
  <circle cx="80" cy="128" r="28" fill="url(#spark)"/>
  <text x="80" y="136" font-family="Georgia, serif" font-size="26" font-weight="700" fill="white" text-anchor="middle">✶</text>

  <!-- Brand name -->
  <text x="122" y="118" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#1f1b16" letter-spacing="-0.5">NameSpark</text>
  <text x="122" y="145" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#a9805a" letter-spacing="2">BABY</text>

  <!-- Main headline -->
  <text x="80" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#1f1b16" letter-spacing="-2">Le prénom de</text>
  <text x="80" y="355" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#1f1b16" letter-spacing="-2">votre bébé,</text>
  <text x="80" y="442" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700" fill="#c9a27a" letter-spacing="-1">choisi ensemble.</text>

  <!-- Separator -->
  <rect x="80" y="476" width="80" height="3" fill="#c9a27a" rx="2"/>

  <!-- Subtitle -->
  <text x="80" y="518" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#6b6259" letter-spacing="0.2">Votez en couple · Famille · Trouvez le prénom parfait</text>

  <!-- Decorative hearts -->
  <text x="900" y="310" font-size="52" opacity="0.15">❤️</text>
  <text x="1050" y="220" font-size="36" opacity="0.12">💛</text>
  <text x="980" y="420" font-size="30" opacity="0.1">✨</text>

  <!-- Bottom URL pill -->
  <rect x="80" y="572" width="310" height="38" rx="19" fill="#1f1b16" opacity="0.08"/>
  <text x="235" y="597" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6b6259" text-anchor="middle" letter-spacing="0.5">namespark-baby.vercel.app</text>

  <!-- Decorative right side dots -->
  <circle cx="820" cy="315" r="3" fill="#c9a27a" opacity="0.3"/>
  <circle cx="840" cy="295" r="2" fill="#c9a27a" opacity="0.2"/>
  <circle cx="805" cy="335" r="2" fill="#c9a27a" opacity="0.2"/>
  <circle cx="855" cy="315" r="1.5" fill="#c9a27a" opacity="0.15"/>
</svg>
